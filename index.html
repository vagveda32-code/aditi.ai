<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>अदिति · अथर्ववेद सहायिका</title>
<meta name="description" content="अदिति — अथर्ववेद के सूक्तों का अर्थ, महत्त्व और वीडियो-स्क्रिप्ट, आवाज़ में।">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="अदिति">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Tiro+Devanagari+Sanskrit&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&display=swap">
<style>
:root{
  --bg:#ffffff;--g1:rgba(66,133,244,.50);--g2:rgba(155,114,203,.42);--g3:rgba(217,101,112,.36);--surface:#f0f4f9;--surface2:#e5eaf2;--ink:#1f1f1f;--mut:#5f6368;--rule:#e3e6ea;--user:#e9eef6;--card:#f0f4f9;
  --acc:#1a73e8;--live:#0b57d0;--liveInk:#fff;--danger:#d93025;
  --grad:linear-gradient(90deg,#4285f4 0%,#9b72cb 55%,#d96570 100%);
  --body:"Mukta","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Bengali","Noto Sans Gujarati","Noto Sans Gurmukhi",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mantra:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131314;--g1:rgba(66,133,244,.78);--g2:rgba(155,114,203,.62);--g3:rgba(217,101,112,.52);--surface:#1e1f20;--surface2:#282a2c;--ink:#e3e3e3;--mut:#a0a4a8;--rule:#2d2f31;--user:#333537;--card:#1e1f20;
  --acc:#8ab4f8;--live:#1f3fa8;--liveInk:#fff;--shadow:0 1px 3px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131314;--g1:rgba(66,133,244,.78);--g2:rgba(155,114,203,.62);--g3:rgba(217,101,112,.52);--surface:#1e1f20;--surface2:#282a2c;--ink:#e3e3e3;--mut:#a0a4a8;--rule:#2d2f31;--user:#333537;--card:#1e1f20;--acc:#8ab4f8;--live:#1f3fa8;--liveInk:#fff;--shadow:0 1px 3px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--body);overflow:hidden}
/* Gemini जैसी पृष्ठभूमि: नीचे नीला-बैंगनी-गुलाबी धुंधला प्रकाश; सुनते/बोलते समय ऊपर उठकर तेज़ */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow::before{content:"";position:absolute;left:-25%;right:-25%;bottom:-30%;height:70%;
  background:radial-gradient(38% 52% at 28% 55%,var(--g1),transparent 70%),radial-gradient(36% 50% at 52% 50%,var(--g2),transparent 70%),radial-gradient(36% 50% at 76% 58%,var(--g3),transparent 70%);
  filter:blur(34px);opacity:.95;transition:opacity .5s ease,transform .6s ease;animation:drift 16s ease-in-out infinite alternate}
body[data-s="rec"] .glow::before,body[data-s="speak"] .glow::before{opacity:1;transform:translateY(-14%) scale(1.12)}
body[data-s="think"] .glow::before{opacity:.95}
@keyframes drift{from{translate:-5% 0}to{translate:5% 0}}
@media (prefers-reduced-motion:reduce){.glow::before{animation:none;transition:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--surface)}
.ib svg{width:22px;height:22px}

.top{flex:none;display:flex;align-items:center;gap:2px;padding:8px 10px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:500;min-width:0;padding-left:4px}
.brand img{width:24px;height:24px}
.lb{min-width:40px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);font-size:.85rem;font-weight:600;color:var(--ink);margin-right:2px}
.lb:hover{background:var(--surface)}
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);padding:16px}
.lgbox{width:min(400px,100%);display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:24px;padding:28px 22px}
.lgbox h2{margin:4px 0 0;font-size:1.5rem;font-weight:500;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lgsub{margin:0;color:var(--mut);font-size:.92rem;text-align:center}
.lgtabs{display:flex;gap:6px;background:var(--surface2);border-radius:999px;padding:4px;width:100%}
.lgtabs button{flex:1;border-radius:999px;padding:8px 10px;font-weight:600;color:var(--mut)}
.lgtabs button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.lgin{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
.lgin:focus{outline:2px solid #4285f4;outline-offset:1px}
.lgerr{margin:0;min-height:1.2em;color:#e5484d;font-size:.88rem;text-align:center}
.lggo{width:100%;padding:13px;border-radius:999px;background:#4285f4;color:#fff;font-weight:600;font-size:1rem}
.lggo:disabled{opacity:.6}
.lgg{min-height:44px;display:flex;justify-content:center;width:100%}
:root[data-tod="eve"] .glow::before{opacity:1;transform:translateY(-12%) scale(1.1)}

.main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.col{max-width:760px;margin:0 auto;padding:8px 18px 24px;min-height:100%;display:flex;flex-direction:column}
.hello{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:4vh 0 8px}
.hi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.hi img{width:58px;height:58px}
.hi h2{margin:0;font-size:clamp(1.9rem,7.5vw,2.6rem);font-weight:500;line-height:1.2;letter-spacing:-.01em}
.hi h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sugg{display:flex;flex-direction:column;gap:4px}
.sg{display:flex;align-items:center;gap:16px;text-align:left;padding:12px 10px;border-radius:16px;font-size:1.05rem}
.sg:hover{background:var(--surface)}
.sg .i{width:26px;flex:none;display:grid;place-items:center;color:var(--ink);font-size:1.2rem}
.sg small{display:block;color:var(--mut);font-size:.85rem;line-height:1.4}

.msg{margin:18px 0;display:flex;gap:12px}
.msg.u{justify-content:flex-end}
.msg.u .bub{background:var(--user);border-radius:22px 6px 22px 22px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.a .av{width:28px;height:28px;flex:none;margin-top:3px}
.msg.a .body{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.a .body.err{color:var(--danger)}
.meta{display:block;color:var(--mut);font-size:.8rem;margin-bottom:4px}
.ref{display:block;color:var(--mut);font-size:.78rem;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.acts button{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--mut);background:var(--surface)}
.acts button:hover{color:var(--ink);background:var(--surface2)}
.script{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px 16px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--grad);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.5}}

.foot{flex:none;padding:6px 14px calc(12px + env(safe-area-inset-bottom))}
.st{max-width:760px;margin:0 auto 8px;padding:0 12px;font-size:.84rem;color:var(--mut);display:none;align-items:center;gap:8px}
.st.on{display:flex}
.st i{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:b 1.2s infinite}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--surface);border-radius:32px;padding:7px 7px 7px 20px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.box textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;resize:none;padding:10px 0;max-height:140px;line-height:1.5}
.box textarea::placeholder{color:var(--mut)}
#mic{background:var(--live);color:var(--liveInk)}
#mic.rec{background:var(--danger);animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(217,48,37,.2)}}
#mic.think{opacity:.5}
#snd{background:var(--ink);color:var(--bg)}
#stp{background:var(--surface2)}
.ear{width:8px;height:8px;border-radius:50%;background:#22c55e;align-self:center;margin:0 6px;display:none;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.ear.on{display:none}
.ear.hear{display:none}
.hint{max-width:760px;margin:8px auto 0;text-align:center;font-size:.74rem;color:var(--mut)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--bg);z-index:50;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:6px;padding:10px 12px}
.drawer h3{margin:0;font-weight:500;flex:1}
.newbtn{margin:4px 12px 10px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:11px 16px;font-weight:500}
.hlist{flex:1;overflow-y:auto;padding:0 8px 12px}
.hgrp{font-size:.78rem;color:var(--mut);padding:10px 10px 4px}
.hitem{display:flex;align-items:center;border-radius:999px}
.hitem:hover,.hitem.cur{background:var(--surface)}
.hitem button.t{flex:1;text-align:left;padding:9px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.94rem}
.hitem button.x{width:34px;height:34px;border-radius:50%;color:var(--mut);opacity:.7}
.hempty{color:var(--mut);font-size:.9rem;padding:12px}

/* full-screen pages (settings, list, reader) */
.page{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.page.on{transform:none}
.page>header{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px}
.page>header h3{margin:0;flex:1;text-align:center;font-weight:500;font-size:1.15rem;padding-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;overflow-y:auto;padding:4px 16px 28px;max-width:680px;width:100%;margin:0 auto}
.grp{font-size:.88rem;color:var(--mut);margin:18px 6px 8px}
.card{background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--rule)}
button.row:hover{background:var(--surface2)}
.row .ri{width:24px;flex:none;display:grid;place-items:center;color:var(--ink)}
.row .ri svg{width:22px;height:22px}
.row .rt{flex:1;min-width:0}
.row .rt small{display:block;color:var(--mut);font-size:.8rem;line-height:1.35}
.row .rv{color:var(--mut);font-size:.92rem;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--mut)}
.sw{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface2);flex:none;transition:background .2s;border:1px solid var(--rule)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{transform:translateX(18px);background:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px}
.opt+.opt{border-top:1px solid var(--rule)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .dot{border-color:var(--acc)}
.opt[aria-checked=true] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.opt .play{margin-left:auto;color:var(--acc);font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.in{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;outline:0;padding:0;font-size:1rem}
.chk{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.chk label{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:.9rem;cursor:pointer;background:var(--bg)}
.chk input{accent-color:var(--acc);margin:0}
.note{font-size:.84rem;color:var(--mut);margin:10px 6px;line-height:1.5}
.about{text-align:center;padding:20px 10px;color:var(--mut)}
.about img{width:64px;height:64px}

.ktabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.ktabs::-webkit-scrollbar{display:none}
.ktabs button{flex:none;border-radius:999px;padding:6px 14px;font-size:.9rem;background:var(--surface)}
.ktabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:10px 16px}
.slist button{display:flex;gap:12px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--rule)}
.slist button:hover{background:var(--surface)}
.slist .n{flex:none;width:48px;color:var(--mut);font-size:.85rem;padding-top:2px;font-variant-numeric:tabular-nums}
.slist .tt{display:block;font-weight:500}
.slist .sb{display:block;font-size:.8rem;color:var(--mut)}
.rmeta{color:var(--mut);font-size:.88rem;margin:4px 0 10px}
.rtext{white-space:pre-wrap;font-size:1.02rem;line-height:1.85}
.rbh{margin-top:14px;border-top:1px solid var(--line,#333);padding-top:10px}.rbh summary{cursor:pointer;font-weight:600;padding:6px 0}
.rtext.big{font-size:1.2rem}
details.alt{margin-top:16px;background:var(--surface);border-radius:14px;padding:10px 14px}
details.alt summary{cursor:pointer;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:14px;font-size:.88rem;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(92vw,520px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<!-- लॉगिन -->

    <img src="logo.svg" alt="" width="56" height="56">

    <p class="lgsub" data-t="lgSub"></p>

    <button class="lb" id="langb" data-ta="langL">EN</button>

  MS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  return MS}
function releaseMic(){if(MS){MS.getTracks().forEach(t=>t.stop());MS=null}}

/* ---------------- “Hey Aditi” — आवाज़ की हलचल पहचानो, छोटा टुकड़ा Sarvam से लिखवाओ, नाम मिले तो जागो ----------------
   browser का अपना speech-recognition फ़ोन पर भरोसेमंद नहीं, इसलिए यह तरीका Android और iPhone दोनों पर चलता है। */
// "आदित्य / Aditya" जैसे शब्दों पर न जागे — सिर्फ़ "अदिति" पर
const WAKE=/(?:(?:अ|आ|ए|ऐ)\s?[दडड़][िीे]?\s?[तटथ][िी]|अदिति|अदिती|आदिति|आदिती|adit(?:i|ee|hi)|adeeti|editi|ಅದಿತಿ|ಆದಿತಿ|అదితి|ఆదితి|அதிதி|অদিতি|અદિતિ|ਅਦਿਤੀ)(?![्य\u094D])/i;
let wakeOn=false,wk=null,wkBusy=false,wkTimes=[],wkQuiet=0;
function beep(){try{const c=getAC(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.26)}catch(e){}}
async function wakeStart(){
  if(!S.wake||state!=="idle"||document.hidden||wkBusy)return;
  if(wk){wk.active=true;wkQuiet=Date.now()+1200;$("ear").classList.add("on");return}
  let stream;try{stream=await getMic()}catch(e){return}
  if(state!=="idle")return;
  const ctx=getAC();try{await ctx.resume()}catch(e){}
  const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),mute=ctx.createGain();mute.gain.value=0;
  const rate=ctx.sampleRate,frameSec=4096/rate,pre=[];let noise=0.01,cap=null,quiet=0,loud=0;
  wk={active:true,src,proc,mute};wakeOn=true;$("ear").classList.add("on");
  proc.onaudioprocess=e=>{
    if(!wk||!wk.active||wkBusy||Date.now()<wkQuiet)return;
    const d=new Float32Array(e.inputBuffer.getChannelData(0));
    let s=0;for(let i=0;i<d.length;i++)s+=d[i]*d[i];const rms=Math.sqrt(s/d.length);
    const th=Math.max(0.012,noise*3.2);
    if(!cap){
      pre.push(d);if(pre.length>4)pre.shift();
      if(rms>th){if(++loud>=2){cap=[...pre];quiet=0;$("ear").classList.add("hear")}}
      else{loud=0;noise=noise*0.97+rms*0.03}
    }else{
      cap.push(d);
      if(rms>th)quiet=0;else quiet+=frameSec;
      const dur=cap.length*frameSec;
      if(quiet>0.55||dur>4.5){const clip=cap;cap=null;loud=0;$("ear").classList.remove("hear");
        if(dur>=0.45&&dur<=4.6)checkWake(clip,rate)}
    }};
  src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
}
function wakePause(){wkQuiet=Date.now()+1500;if(wk)wk.active=false;$("ear").classList.remove("on","hear")}
function wakeKill(){if(wk){try{wk.proc.disconnect();wk.src.disconnect();wk.mute.disconnect()}catch(e){}}wk=null;wakeOn=false;$("ear").classList.remove("on","hear")}
async function checkWake(clip,rate){
  const now=Date.now();wkTimes=wkTimes.filter(t=>now-t<60000);
  if(wkTimes.length>=14)return;                    // बहुत शोर हो तो एक मिनट में 14 से ज़्यादा जाँच नहीं (खर्च बचाने को)
  wkTimes.push(now);wkBusy=true;
  try{
    const fd=new FormData();fd.append("file",wav(clip,rate),"wake.wav");fd.append("lang",lang);
    const {text}=await call("stt",fd);
    const m=(text||"").match(WAKE);
    if(m&&state==="idle"){
      const rest=text.slice(m.index+m[0].length).replace(/^[^\s,।.!?]*/,"").replace(/^[\s,।.!?]+/,"").trim();
      beep();wkBusy=false;
      if(rest.split(/\s+/).filter(Boolean).length>=2)await ask(rest);else await listen();
      return}
  }catch(e){}
  wkBusy=false}
document.addEventListener("visibilitychange",()=>{if(document.hidden){wakeKill();releaseMic()}else setTimeout(wakeStart,400)});

  setState("think");try{const {audios}=await call("tts",{text:isMantra?"ॐ भूर्भुवः स्वः":({hi:"नमस्ते, मैं अदिति हूँ।",en:"Namaste, I am Aditi.",kn:"ನಮಸ್ಕಾರ, ನಾನು ಅದಿತಿ.",te:"నమస్తే, నేను అదితి.",mr:"नमस्कार, मी अदिती.",sa:"नमो नमः, अहम् अदितिः।",ta:"வணக்கம், நான் அதிதி.",bn:"নমস্কার, আমি অদিতি।",gu:"નમસ્તે, હું અદિતિ છું.",pa:"ਸਤ ਸ੍ਰੀ ਅਕਾਲ, ਮੈਂ ਅਦਿਤੀ ਹਾਂ।"})[lang],lang,pace,mantra:isMantra,voice:v,mvoice:v});setState("speak");await playAll(audios)}catch(e){toast("🔇 "+e.message)}setState("idle")}
async function report(){let ping="";try{ping=JSON.stringify(await getJSON("a=ping"))}catch(e){ping="ping failed: "+e.message}
  const t="Aditi problem report\nsite: "+location.host+"\ntime: "+new Date().toISOString()+"\nping: "+ping+"\nerrors:\n"+(ERRLOG.length?ERRLOG.map(e=>`- ${e.t} [${e.a} ${e.status}] ${e.txt}`).join("\n"):"(none)")+"\nua: "+navigator.userAgent;
  copyText(t);toast(U("reportDone"))}
function openScriptSet(){$("subt").textContent=U("setScriptS");const b=$("subbody");b.textContent="";
  const sel=(label,key,opts)=>{const r=el("div","row");const t=el("span","rt",label);const s=el("select","in");s.style.textAlign="right";s.style.width="auto";s.style.maxWidth="55%";
    for(const [v,l] of opts){const o=el("option",null,l);o.value=v;if(String(S[key])===String(v))o.selected=true;s.append(o)}s.onchange=()=>{S[key]=key==="dur"?+s.value:s.value;saveS()};r.append(t,s);return r};
  const txt=(label,key,ph)=>{const r=el("div","row");const t=el("span","rt",label);const i=el("input","in");i.style.textAlign="right";i.style.maxWidth="55%";i.placeholder=ph||"";i.value=S[key]||"";i.oninput=()=>{S[key]=i.value;saveS()};r.append(t,i);return r};
  b.append(card(
    sel(U("langL"),"slang",[["",U("sameLang")],["हिंदी","हिंदी"],["Hinglish","Hinglish"],["English","English"],["संस्कृत + हिंदी","संस्कृत + हिंदी"],["ಕನ್ನಡ (Kannada)","ಕನ್ನಡ"],["తెలుగు (Telugu)","తెలుగు"],["मराठी","मराठी"],["संस्कृत","संस्कृतम्"],["தமிழ் (Tamil)","தமிழ்"],["বাংলা (Bengali)","বাংলা"],["ગુજરાતી (Gujarati)","ગુજરાતી"],["ਪੰਜਾਬੀ (Punjabi)","ਪੰਜਾਬੀ"]]),
    sel(U("durL"),"dur",[[0.5,U("d05")],[1,U("d1")],[2,U("d2")],[3,U("d3")],[5,U("d5")]]),
    sel(U("toneL"),"tone",[["शांत और आध्यात्मिक",U("t1")],["प्रेरणादायक",U("t2")],["गंभीर और ज्ञानवर्धक",U("t3")],["भक्तिमय",U("t4")],["सरल और रोचक",U("t5")]]),
    sel(U("styleL"),"style",[["Voiceover Narration","Voiceover Narration"],["Storytelling","Storytelling"],["Q&A / Explainer","Q&A / Explainer"],["Reel Hook-style","Reel Hook-style"]]),
    txt("Episode","ep",U("epP")),txt("Channel","brand","@…")));
  b.append(grp(U("withL")));
  const ck=el("div","chk");
  for(const [v,l] of [["मंत्र (मूल पाठ)",U("oM")],["सरल अर्थ",U("oA")],["Reel के लिए 15-15 सेकंड के हिस्से, हर हिस्से के साथ स्क्रीन पर दिखने वाला छोटा text",U("oR")],["Visual / Scene suggestions",U("oV")],["Title, Description और Hashtags","Title + Tags"],["Thumbnail text ideas","Thumbnail"]]){
    const lb=el("label");const c=el("input");c.type="checkbox";c.checked=S.extras.includes(v);c.onchange=()=>{S.extras=c.checked?[...new Set([...S.extras,v])]:S.extras.filter(x=>x!==v);saveS()};lb.append(c,document.createTextNode(l));ck.append(lb)}
  b.append(card(ck));openPage("psub")}
let adminPin="";
async function openLearned(){$("subt").textContent=U("learnT");const b=$("subbody");b.textContent="";b.append(el("p","note",U("loading")));openPage("psub");
  let list=[];try{list=await getJSON("a=learned")}catch(e){b.textContent="";b.append(el("p","note",U("errSrv")));return}
  b.textContent="";if(!list.length){const n=el("p","note",U("learnNone"));n.style.whiteSpace="pre-wrap";b.append(n);return}
  const c=el("div","card");
  for(const f of list){const r=el("div","row");const t=el("span","rt",f.fact);t.append(el("small",null,[f.sukta&&("अथर्ववेद "+f.sukta),f.topic,new Date(f.ts).toLocaleDateString(U("locale"))].filter(Boolean).join(" · ")));
    const d=el("button","ib");d.type="button";d.innerHTML=SI.trash;d.setAttribute("aria-label",U("del"));
    d.onclick=async()=>{if(!adminPin)adminPin=prompt(U("pinQ"))||"";if(!adminPin)return;
      try{await call("forget",{id:f.id,pin:adminPin});r.remove()}catch(e){adminPin="";toast("⚠️ "+e.message)}};
    r.append(t,d);c.append(r)}
  b.append(c)}
$("setb").onclick=()=>{renderSettings();openPage("pset")};
// रूप: "समय के अनुसार" — सुबह (5–11) गहरा, दोपहर (11–17) उजला, शाम-रात (17–5) गहरा + तेज़ रंगीन प्रकाश
function applyTheme(){const v=store.get("aditi-theme","time"),de=document.documentElement;delete de.dataset.tod;
  if(v==="time"){const h=new Date().getHours();const tod=h>=5&&h<11?"morning":h>=11&&h<17?"noon":"eve";de.dataset.tod=tod;de.dataset.theme=tod==="noon"?"light":"dark"}
  else if(v==="auto")delete de.dataset.theme;else de.dataset.theme=v}
function setTheme(v){store.set("aditi-theme",v);applyTheme()}
applyTheme();setInterval(applyTheme,5*60*1000);
// भाषा केवल यहीं से (या सेटिंग से) बदलती है — अपने-आप कभी नहीं
const LSHORT={hi:"हि",en:"EN",kn:"ಕ",te:"తె",mr:"म",sa:"सं",ta:"த",bn:"বা",gu:"ગુ",pa:"ਪੰ"};
function pickLang(){pick(U("langL"),Object.entries(LANGS).map(([k,v])=>[k,v.l]),lang,v=>{lang=v;store.set("aditi-lang",v);applyLang()})}
$("langb").onclick=pickLang;

function applyLang(){document.documentElement.lang=lang;applyUI();qi.placeholder=T("ph");$("langb").textContent=LSHORT[lang]||lang;
  const nm=store.get("aditi-name","");const h=$("hi1");h.textContent="";
  const l1=el("span",null,T("hello")+(nm?", "+nm:""));h.append(l1,document.createElement("br"),document.createTextNode(U("greet2")));
  $("hint").textContent=S.wake?T("hint"):"";
  renderHist();if($("hello").hidden===false)renderSugg();
  if(stack.includes("pset"))renderSettings();

/* ---------------- इनपुट ---------------- */
mic.innerHTML=ICON_MIC;
mic.onclick=()=>{unlock();if(state==="rec"&&stopRec)return stopRec();if(idle())listen()};
$("stp").onclick=()=>{player.pause();setState("idle")};

function openUsers(){$("subt").textContent=U("lgUsers");const b=$("subbody");b.textContent="";
  const f=el("div","row");const pin=el("input","in");pin.type="password";pin.inputMode="numeric";pin.placeholder="PIN";const go=el("button","pill","OK");go.type="button";f.append(pin,go);
  const list=el("div","card");b.append(card(f),list);
  go.onclick=async()=>{list.textContent="…";try{const j=await call("users",{pin:pin.value});list.textContent="";
    list.append(el("div","row",j.length+" "+U("lgUsers")));for(const u of j)list.append(el("div","row",u.name+" · "+u.id+" · "+new Date(u.created).toLocaleDateString(U("locale")||"hi-IN")))}
    catch(e){list.textContent=e.message}};
  openPage("psub")}
let lgMode="in";
function showLogin(){const p=$("login");if(!p.hidden)return;wakeKill&&wakeKill();p.hidden=false;lgDraw();gInit()}
// "Google से जारी रखें" — Netlify में GOOGLE_CLIENT_ID हो तभी दिखता है
let gReady=false;
async function gInit(){if(gReady)return;try{const j=await (await fetch(API+"?a=ping")).json();if(!j.gid)return;gReady=true;
  const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
  sc.onload=()=>{google.accounts.id.initialize({client_id:j.gid,callback:gDone,auto_select:true});
    $("lgG").hidden=false;$("lgOr").hidden=false;google.accounts.id.renderButton($("lgG"),{theme:document.documentElement.dataset.theme==="light"?"outline":"filled_black",size:"large",shape:"pill",text:"continue_with",width:Math.min(340,$("lgForm").clientWidth-44),locale:lang==="en"?"en":"hi"});
    google.accounts.id.prompt()};document.head.append(sc)}catch(e){}}
async function gDone(resp){$("lgErr").textContent=U("lgWait");
  try{const r=await fetch(API+"?a=google",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential:resp.credential})});const j=await r.json();
    if(j.token)lgOk(j);else $("lgErr").textContent=U("lgE_gbad")}catch(e){$("lgErr").textContent=nosrv()}}
function lgOk(j){TOKEN=j.token;store.set("aditi-token",j.token);store.set("aditi-user",{name:j.name,id:j.id});if(!store.get("aditi-name",""))store.set("aditi-name",j.name);
  $("login").hidden=true;$("lgPass").value="";$("lgErr").textContent="";applyLang();renderSugg();if(S.wake)wakeStart()}
function lgDraw(){const up=lgMode==="up";$("lgName").hidden=!up;$("lgGo").textContent=U(up?"lgGoUp":"lgGoIn");
  $("lgTabIn").setAttribute("aria-pressed",!up);$("lgTabUp").setAttribute("aria-pressed",up);$("lgPass").autocomplete=up?"new-password":"current-password";$("lgErr").textContent=""}
$("lgTabIn").onclick=()=>{lgMode="in";lgDraw()};$("lgTabUp").onclick=()=>{lgMode="up";lgDraw()};
$("lgForm").onsubmit=async e=>{e.preventDefault();const go=$("lgGo");if(go.disabled)return;
  const body={name:$("lgName").value,id:$("lgId").value,password:$("lgPass").value};$("lgErr").textContent="";go.disabled=true;go.textContent=U("lgWait");
  try{const r=await fetch(API+"?a="+(lgMode==="up"?"signup":"login"),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({error:"store"}));
    if(j.token)lgOk(j)
    else $("lgErr").textContent=U("lgE_"+j.error)!=="lgE_"+j.error?U("lgE_"+j.error):(j.error||"?")}
  catch(err){$("lgErr").textContent=nosrv()}
  go.disabled=false;go.textContent=U(lgMode==="up"?"lgGoUp":"lgGoIn")};
function logout(){try{google.accounts.id.disableAutoSelect()}catch(e){}TOKEN="";store.set("aditi-token","");store.set("aditi-user",null);closeAll();showLogin()}

applyLang();setState("idle");if(TOKEN)renderSugg();else showLogin();
if(TOKEN)getJSON("a=me").catch(()=>{});

["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{unlock();if(TOKEN&&S.wake&&!wk)wakeStart()},true));
